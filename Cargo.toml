[package]
name = "mos65x"
version = "0.1.0-beta"
edition = "2024"
authors = ["Akshat Sharma akshat_sharma@zohomail.in"]
license = "BSD-3-Claude License"
description = "A cycle-accurate emulation backend for MOS 65xx processor-based systems."
repository = "https://github.com/ksaze/mos65x"

[lib]
name = "mos65x"
path = "src/lib.rs"

[dependencies]
bitflags = "2.9.3"
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }

[features]
default = []

# Enables the generic device handle types (SharedDevice, SyncDevice, OwnedDevice)
# Required for most use cases outside of no_std
handles = []

# Enables basic device implementations like MemoryDevice (RAM/ROM), EmulatorControl.
# Also enables the DMAController trait used by GenericSystem
devices = []

# Generic System implementation which supports plugging in any Variant and DeviceHandle.
# Exposes systems with DeviceHandle parameters from "handles" like RcSystem, ArcSystem, BoxSystem.
generic_system = ["handles", "devices"]

# Enables executions drivers like interactive TUI interface, headless execution drivers for n cycles or until CPU is jammed.
driver = ["dep:ratatui", "dep:crossterm", "devices"]

# Exposes internal CPU types like CPUState, and Flags (Status) for testing
test-utils = []

[dev-dependencies]
# Used by SingleStepTests
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[[test]]
name = "singlestep"
required_features = ["test_utils"]
